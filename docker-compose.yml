services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports: ['${MYSQL_PORT:-3306}:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uapp', '-papp']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: SMTP on 1025, inbox UI and API on 8025. Nothing leaves
  # the machine, and no account is needed. `docker compose up -d mailpit`, then
  # point SMTP_HOST=127.0.0.1 / SMTP_PORT=1025 at it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_HTTP_PORT:-8025}:8025'
